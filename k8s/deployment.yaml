apiVersion: apps/v1
kind: Deployment
metadata:
  name: brain-tasks-app
  labels:
    app: brain-tasks-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: brain-tasks-app
  template:
    metadata:
      labels:
        app: brain-tasks-app
    spec:
      containers:
        - name: brain-tasks-app
          image: 864365983839.dkr.ecr.ap-southeast-2.amazonaws.com/brain-tasks-app:v1
          ports:
            - containerPort: 3000
          imagePullPolicy: IfNotPresent